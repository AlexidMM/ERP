<aside class="sidebar" aria-label="Menú principal">
  <header class="sidebar-header">
    <div class="brand-block">
      <i class="pi pi-briefcase" aria-hidden="true"></i>
      <span>ERP</span>
    </div>

    <button
      pButton
      type="button"
      [icon]="collapseButtonIcon()"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      class="toggle-button"
      [attr.aria-label]="collapseButtonLabel()"
      [attr.title]="collapseButtonLabel()"
      (click)="onToggleSidebar()"
    ></button>
  </header>

  <p-panelmenu [model]="menuItems()"></p-panelmenu>

  @if (!canAccessAnyFeature()) {
    <p-message severity="warn" text="Usuario sin permisos de modulos."></p-message>
  }

  <button
    pButton
    type="button"
    icon="pi pi-sign-out"
    label="Cerrar sesion"
    class="action-button"
    severity="secondary"
    [attr.aria-label]="'Cerrar sesion'"
    (click)="onLogout()"
  ></button>

  <footer class="sidebar-footer">
    <p class="sidebar-version">ERP v6</p>
  </footer>
</aside>
