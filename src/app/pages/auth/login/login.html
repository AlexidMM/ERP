<div class="card">
  <h2>Login</h2>

  <form (ngSubmit)="onSubmit()">
    <label>Email</label>
    <input pInputText type="email" [(ngModel)]="email" name="email" required />

    <label>Password</label>
    <input pInputText type="password" [(ngModel)]="password" name="password" required />

    <p-button type="submit" label="Entrar"></p-button>
  </form>

  <p>
    ¿No tienes cuenta?
    <a routerLink="/auth/register">Regístrate</a>
  </p>
</div>
