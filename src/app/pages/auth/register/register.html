<div class="card">
  <h2>Register</h2>

  <form (ngSubmit)="onSubmit()">
    <label>Nombre</label>
    <input pInputText type="text" [(ngModel)]="name" name="name" required />

    <label>Email</label>
    <input pInputText type="email" [(ngModel)]="email" name="email" required />

    <label>Password</label>
    <input pInputText type="password" [(ngModel)]="password" name="password" required />

    <p-button type="submit" label="Crear cuenta"></p-button>
  </form>

  <p>
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login">Inicia sesión</a>
  </p>
</div>
