<section class="users" aria-label="Campos solicitados para usuarios">
  <p-card>
    <h2 class="users-title">USERS</h2>

    <div class="users-grid">
      <div class="field-item">
        <label>Usuario</label>
        <input pInputText type="text" placeholder="maria.lopez" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Email</label>
        <input pInputText type="email" placeholder="maria.lopez@erp.com" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Nombre completo</label>
        <input pInputText type="text" placeholder="María Fernanda López" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Dirección</label>
        <input pInputText type="text" placeholder="Av. Universidad 450, Querétaro" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Teléfono</label>
        <input pInputText type="tel" placeholder="4423187654" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Fecha de nacimiento</label>
        <input pInputText type="date" value="1999-07-18" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Contraseña</label>
        <input pInputText type="password" placeholder="M4ria#ERP2026" [readonly]="true" />
      </div>

      <div class="field-item">
        <label>Confirmar contraseña</label>
        <input pInputText type="password" placeholder="M4ria#ERP2026" [readonly]="true" />
      </div>
    </div>
  </p-card>
</section>
